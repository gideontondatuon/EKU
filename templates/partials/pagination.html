{% if page_obj %}<nav class="pagination" aria-label="Navigasi halaman"><span>Halaman {{ page_obj.number }} dari {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} data</span><div class="pagination-links">{% if page_obj.has_previous %}<a class="btn btn-secondary btn-sm" href="?{{ filter_query }}&amp;page={{ page_obj.previous_page_number }}">← Sebelumnya</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-secondary btn-sm" href="?{{ filter_query }}&amp;page={{ page_obj.next_page_number }}">Berikutnya →</a>{% endif %}</div></nav>{% endif %}
