name: eku-dashboard-dev

x-app: &app
  build: .
  image: eku-dashboard:local
  env_file:
    - ${EKU_ENV_FILE:-.env.docker}
  environment:
    DJANGO_ENV: development
    PRIVATE_ROOT: /app/.private
    DATABASE_URL: postgresql://${POSTGRES_USER:-eku}:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD pada env file}@db:5432/${POSTGRES_DB:-eku}
  volumes:
    - private_uploads:/app/.private
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eku}
      POSTGRES_USER: ${POSTGRES_USER:-eku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD pada env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  private_uploads:
