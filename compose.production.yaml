# Berkas standalone, bukan overlay compose.yaml. Pakai -f compose.production.yaml.
name: eku-dashboard-production

x-app: &app
  image: ${EKU_IMAGE:-eku-dashboard:local}
  build: .
  env_file:
    - ${EKU_ENV_FILE:-.env.production}
  environment:
    DJANGO_ENV: ${DJANGO_ENV:-production}
    DJANGO_DEBUG: "0"
    TRUST_PROXY_SSL: "1"
    PRIVATE_ROOT: /app/.private
    DATABASE_URL: ${DATABASE_URL:?Isi DATABASE_URL production}
  volumes:
    - private_uploads:/app/.private
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eku}
      POSTGRES_USER: ${POSTGRES_USER:-eku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https','Host':'localhost'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${EKU_HTTP_BIND:-127.0.0.1}:8080:80"
      - "${EKU_HTTPS_BIND:-127.0.0.1}:8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Isi path sertifikat TLS}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Isi path private key TLS}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  private_uploads:
